name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Monday morning, for the heavy RELATIO job below: it installs torch and a
  # language model, and what it catches is somebody else's release breaking the
  # extraction rather than a change of ours.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    # Windows is not an afterthought here: the researchers this is written for
    # mostly work on it, and it is where path handling and the console script
    # break first.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[llm,topics]"

      # The suites need no network and no credentials, which is what makes them
      # worth running on every push.
      #
      # One step per file, deliberately. Grouped in a single `run:` block they
      # were run by pwsh on Windows, which propagates the exit code of the last
      # command only: eight of the nine suites could fail there and the job
      # still came out green.
      - name: The merge is not allowed to drift
        run: python tests/test_golden_merge.py
      - name: Merge
        run: python tests/test_merge.py
      - name: Analysis
        run: python tests/test_analysis.py
      - name: Dashboard
        run: python tests/test_dashboard.py
      - name: Library
        run: python tests/test_library.py
      - name: Participation
        run: python tests/test_participation.py
      - name: Words
        run: python tests/test_words.py
      - name: Narratives
        run: python tests/test_narratives.py
      - name: Emotions
        run: python tests/test_emotions.py
      - name: Compare
        run: python tests/test_compare.py
      - name: Views
        run: python tests/test_views.py
      - name: Corpus
        run: python tests/test_corpus.py
      - name: Sharing an experiment
        run: python tests/test_bundle.py
      - name: One table per unit
        run: python tests/test_tables.py
      - name: Two studies out of one collection
        run: python tests/test_studies.py
      - name: One definition of a word
        run: python tests/test_tokens.py
      - name: The documentation links
        run: python tests/test_docs.py

      - name: The console script works
        run: chatlens --help
      - name: The status command works
        run: chatlens status

      # End to end on synthetic data: no credentials, no network, and it is the
      # first thing a new user runs, so it is the first thing that must work.
      - name: The demo runs end to end
        run: chatlens demo ci-demo

  # The heavy extras are what the words, narratives and comparison pages are
  # built on, and above they are neither installed nor exercised: those tests
  # either mock the imports away or skip themselves. One job, one platform,
  # with the real dependencies present.
  extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install everything
        run: python -m pip install --upgrade pip && python -m pip install -e ".[all]"
      - name: Words
        run: python tests/test_words.py
      - name: Narratives
        run: python tests/test_narratives.py
      - name: Compare
        run: python tests/test_compare.py
      - name: Emotions
        run: python tests/test_emotions.py

  # RELATIO, which the job above does not install: those tests mock the import
  # away or skip themselves, so the extraction path — the one that needs 1.6 GB
  # of torch and transformers, and the one a dependency clash breaks first — has
  # never actually run in CI. Weekly rather than per-push, because it is a long
  # install for a path that changes rarely, and `continue-on-error` because the
  # thing most likely to fail is somebody else's release rather than our code.
  relations:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install everything, including the language model
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m spacy download en_core_web_md
      - name: Install RELATIO
        run: chatlens install-relatio
      - name: It imports, and it extracts
        run: python tests/relatio_smoke.py
      - name: The narratives suite, with the real package present
        run: python tests/test_narratives.py

  # A gate, because the tree is clean: the rule set in pyproject is the
  # narrow one that catches something real — dead imports, shadowed names,
  # variables assigned and never used — rather than the default one, which
  # would bury those under this codebase's deliberate style.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install ruff
      - name: Ruff
        run: ruff check .
