site_name: chatlens
site_description: Text analysis of chat data from behavioural experiments
site_url: https://nicomil.github.io/chatlens/
repo_url: https://github.com/nicomil/chatlens
repo_name: nicomil/chatlens
copyright: MIT licensed

theme:
  name: material
  palette:
    # The site follows the reader's system setting, and lets them override it.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

# Generated by scripts/build_docs.py from README.md. Do not edit by hand.
nav:
  - Home: index.md
  - "What it does, in brief": 01-what-it-does-in-brief.md
  - "Installation": 02-installation.md
  - "API keys": 03-api-keys.md
  - "Participant data": 04-participant-data.md
  - "Your own experiment": 05-your-own-experiment.md
  - "The analysis procedure": 06-the-analysis-procedure.md
  - "The pages in the dashboard": 07-the-pages-in-the-dashboard.md
  - "A walk through, with pictures": 08-a-walk-through-with-pictures.md
  - "The files produced": 09-the-files-produced.md
  - "Before analysing: three filters": 10-before-analysing-three-filters.md
  - "How the measures are built": 11-how-the-measures-are-built.md
  - "TopicGPT": 12-topicgpt.md
  - "Costs and volumes": 13-costs-and-volumes.md
  - "If something does not add up": 14-if-something-does-not-add-up.md
  - "Checking the tools": 15-checking-the-tools.md
  - "Results on the pilot": 16-results-on-the-pilot.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nicomil/chatlens
