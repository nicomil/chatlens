site_name: chatlens
site_description: Text analysis of chat data from behavioural experiments
site_url: https://nicomil.github.io/chatlens/
repo_url: https://github.com/nicomil/chatlens
repo_name: nicomil/chatlens
copyright: MIT licensed

theme:
  name: material
  palette:
    # The site follows the reader's system setting, and lets them override it.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

# Generated by scripts/build_docs.py from the sources. Do not edit by hand.
nav:
  - "Home": index.md
  - "Guide": guide.md
  - "Installation": installation.md
  - "Commands": commands.md
  - "Your own experiment": your-experiment.md
  - "The analysis procedure": procedure.md
  - "The pages in the dashboard": dashboard.md
  - "The files produced": files.md
  - "How the measures are built": measures.md
  - "API keys, and what they cost": keys-and-costs.md
  - "TopicGPT": topics.md
  - "Participant data": participant-data.md
  - "When something does not add up": troubleshooting.md
  - "Results on the pilot": pilot.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nicomil/chatlens
