[experiment]
name    = "Ultimatum with pre-play chat"
adapter = "generic_chat"

[input]
messages     = "chat_log*.csv"
participants = "roster*.csv"

[columns]
group     = "team"
sender    = "from_seat"
receiver  = "to_seat"
body      = "text"
timestamp = "sent_at"
treatment = "condition"

[treatments]
anonymous = "Anonymous offers"
named     = "Named offers"

# Without this the descriptive pages work and the four that explain something
# do not, so the example would show half the tool.
[outcome]
column = "accepted"
kind   = "binary"
unit   = "sender_group"
label  = "Offer accepted"
