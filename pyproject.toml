[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatlens"
version = "1.0.0"
description = "Text analysis of chat data from behavioural experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nicola Milella", email = "nicombk@gmail.com" }]
keywords = [
    "text analysis", "experimental economics", "oTree", "chat",
    "content analysis", "LIWC", "topic modelling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]

# The deterministic measures and the dashboard run on the standard library
# alone. Only the sentiment backend is a hard dependency, because falling back
# to the seed dictionaries changes the numbers and that should be a choice, not
# an accident of installation.
dependencies = [
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
# What working on chatlens needs, as opposed to using it. The suites are plain
# unittest scripts and run without any of this; ruff and the rest are here so
# that "install the development tools" is one documented command rather than a
# pip line remembered differently by everyone.
dev = [
    "ruff>=0.6",
    "build>=1.0",
    "mkdocs-material>=9.5",
]
# The validation rubric.
#
# The anthropic floor is not decoration: the rubric is built on
# `client.messages.parse` with an output schema, and that call arrived in 0.77.0.
# This used to read `anthropic>=0.40,<1` — a floor left behind from when the
# module used `messages.create` — and an environment that resolved to 0.69.0
# could not run the Anthropic provider at all. `llm_rubric.sdk_problem()` says
# so in words if a resolver puts an older one back.
#
# The upper bounds are deliberately wide rather than absent: both libraries have
# had a major release since this was written, and the calls used here
# (`messages.parse`, `chat.completions.create` with a JSON response format) are
# present across them.
llm = [
    "openai>=1.54,<4",
    "pydantic>=2.0",
    "anthropic>=0.77,<2",
]
# TopicGPT itself is not installed from here: the prompt files are part of the
# method and live in the repository, not in the published package.
#     chatlens install-topicgpt
topics = [
    "openai>=1.54,<4",
]
# The environment TopicGPT wants, which is not the one everything else wants.
# Its `requirements.txt` (release 0.2.8) declares `openai>=1.54.3,<2.0.0`,
# `anthropic>=0.39.0,<1.0.0` and `numpy>=1.26.2,<2.0.0`, so installing it into a
# shared interpreter pulls all three back — and that is how this project ended
# up with anthropic 0.69.0, which cannot run the rubric at all.
#
# `anthropic<1` is not itself a problem: 0.77 to 0.125 satisfy both it and the
# rubric, which is why the pin below is a range and not `<1` alone. `openai<2`
# and `numpy<2` are the ones that hold other libraries a major version back for
# everybody, scikit-learn included.
#
# Install this extra when TopicGPT will live in the same interpreter, so that the
# downgrade is a declared state rather than a surprise:
#     pip install -e ".[llm,words,narratives,stata,topics-legacy]"
#
# The alternative, and the better one when a machine can afford it, is a second
# virtual environment for the topic stage alone: nothing is shared between them
# but the CSV files.
topics-legacy = [
    "openai>=1.54,<2",
    "anthropic>=0.77,<1",
]
# Word clouds and the coefficient tables. Kept out of the base install: the
# tool is four megabytes and these are about a hundred and fifty.
words = [
    "scikit-learn>=1.3",
    "matplotlib>=3.6",
    "wordcloud>=1.9",
]
# The relational analysis. The language model is a separate download and the
# page prints the command for it: `python -m spacy download en_core_web_md`.
narratives = [
    "spacy>=3.7",
    "statsmodels>=0.14",
]
# The Stata file beside each CSV that `chatlens tables` writes. The CSVs need
# nothing; a .dta is a binary format, and pandas already writes it correctly.
stata = [
    "pandas>=1.5",
]
all = [
    "chatlens[llm,topics,words,narratives,stata]",
]

[project.scripts]
chatlens = "chatlens.cli:main"

[project.urls]
Homepage = "https://github.com/nicomil/chatlens"
Documentation = "https://nicomil.github.io/chatlens"
Source = "https://github.com/nicomil/chatlens"
Issues = "https://github.com/nicomil/chatlens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chatlens"]

[tool.hatch.build.targets.sdist]
include = ["src/chatlens", "tests", "examples", "README.md", "LICENSE"]

# Reporting, not a gate. The default rule set flags the deliberate style of
# this codebase — `dict(...)` over braces, mostly — which would bury the
# findings that matter. These are the ones that catch something real: dead
# imports, names that shadow other names, variables assigned and never used.
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F", "E9", "B", "SIM101", "RUF200"]
# B007 is the loop variable named for what it is and not used, which
# reads better than `_`.
ignore = ["B007", "B008", "B905"]
